name: Hoshiimo CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-root-password
          MYSQL_DATABASE: hoshiimo_test
          MYSQL_USER: hoshiimo
          MYSQL_PASSWORD: test-only-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest-root-password"
          --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      SECRET_KEY: ci-only-signing-key-never-use-in-production-123456
      DATABASE_URL: mysql+asyncmy://hoshiimo:test-only-password@127.0.0.1:3306/hoshiimo_test
      TEST_DATABASE_URL: mysql+asyncmy://hoshiimo:test-only-password@127.0.0.1:3306/hoshiimo_test
      AUTH_RATE_LIMIT: "10000"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pip check
      - run: alembic upgrade head
      - run: alembic check
      - run: alembic downgrade base
      - run: alembic upgrade head
      - run: python -m app.seed
      - run: python -m app.seed
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ../backend/requirements-dev.txt
      - run: npx playwright install --with-deps chromium
      - name: Prepare isolated browser-test database
        working-directory: backend
        env:
          SECRET_KEY: ci-browser-tests-signing-key-never-use-in-production
          DATABASE_URL: sqlite+aiosqlite:///./browser-test.db
        run: |
          alembic upgrade head
          python -m app.seed
      - name: Browser flows and responsive screenshots
        env:
          SECRET_KEY: ci-browser-tests-signing-key-never-use-in-production
          DATABASE_URL: sqlite+aiosqlite:///./browser-test.db
          AUTH_RATE_LIMIT: "10000"
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storefront-browser-results
          path: frontend/test-results/
          retention-days: 7
